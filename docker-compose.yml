# Uso LOCAL/DEV apenas — sobe Postgres/Redis reais para rodar a suíte de testes contra banco de
# verdade. NUNCA use este arquivo no VPS (por isso nem entra no zip de deploy, gerado a partir
# de `git archive` — ver .gitattributes); produção usa exclusivamente docker-compose.prod.yml,
# que não expõe porta nenhuma de Postgres/Redis ao host.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: proptech
      POSTGRES_PASSWORD: proptech
      POSTGRES_DB: proptech
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "${REDIS_PORT:-6379}:6379"

volumes:
  postgres_data:
